name: Personal Windows MSI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  msi:
    name: Windows x64 (unsigned)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      WEBVIEW2_VERSION: 1.0.4078.44
    steps:
      - uses: actions/checkout@v6

      # Native Windows runtime (libmpv-2.dll) lives in Git LFS on the upstream repo only
      - name: Fetch Windows runtime from upstream LFS
        shell: bash
        run: |
          git lfs install --local
          git config lfs.url https://github.com/NuvioMedia/NuvioDesktop.git/info/lfs
          git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**" --exclude=""
          runtime_path="composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          test -f "${runtime_path}"
          size="$(wc -c < "${runtime_path}")"
          echo "libmpv-2.dll: ${size} bytes"
          (( size > 1000000 )) || { echo "LFS runtime not downloaded" >&2; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Empty on purpose: official keys (Supabase, Trakt, MDBList, Sentry) are not available here
      - name: Create empty local.properties
        shell: bash
        run: touch local.properties

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload -NonInteractive -NoCache
          $root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          if (-not (Test-Path (Join-Path $root "build\native\x64\WebView2Loader.dll.lib"))) { throw "WebView2 SDK missing" }
          "WEBVIEW2_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compute app version
        shell: bash
        run: echo "APP_VERSION=0.1.33-alpha.$(printf '%04d' "${GITHUB_RUN_NUMBER}")" >> "$GITHUB_ENV"

      - name: Build unsigned MSI
        shell: pwsh
        run: |
          & .\gradlew.bat :composeApp:packageReleaseMsi `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            "-Pnuvio.desktop.versionName=$env:APP_VERSION" `
            "-Pcompose.desktop.packaging.checkJdkVendor=false" `
            --no-configuration-cache --no-daemon --stacktrace

      - name: Publish MSI to a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          msi="$(find composeApp/build -name "Cinebox-Windows-*.msi" | head -n 1)"
          test -f "$msi"
          ls -lh "$msi"
          gh release create "v${APP_VERSION}-win" "$msi" --title "Windows build ${GITHUB_RUN_NUMBER}" --notes "Unsigned build." --prerelease
