name: Personal macOS DMG

on:
  workflow_dispatch:
    inputs:
      arch:
        description: macOS architecture
        type: choice
        options: [arm64, x86_64]
        default: arm64

permissions:
  contents: write

jobs:
  dmg:
    name: macOS ${{ inputs.arch }} (unsigned)
    runs-on: ${{ inputs.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # Native macOS runtime (.dylib), kept as a release asset in zk4-deps
      - name: Fetch macOS runtime
        env:
          MACOS_ARCH: ${{ inputs.arch }}
        run: |
          RT="composeApp/src/desktopMain/native/macos/runtime/${MACOS_ARCH}"
          curl --fail --location --retry 5 --silent --show-error -o runtime.zip \
            "https://github.com/endorphine27/zk4-deps/releases/download/runtime-v1/runtime-macos-${MACOS_ARCH}.zip"
          unzip -qo runtime.zip -d "${RT}"
          rm runtime.zip
          ls -la "${RT}" | head -5
          file "${RT}/libmpv.2.dylib" | grep -q "Mach-O" || { echo "runtime not downloaded" >&2; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Own CINEBOX server. The public client key is read from the server's discovery document;
      # Trakt, MDBList and Sentry keys stay empty.
      - name: Create local.properties
        shell: bash
        run: |
          key="$(curl -fsS https://destinyab.go.ro:8444/.well-known/cinebox | jq -r .publishable_key)"
          test -n "$key" && test "$key" != null
          {
            echo "CINEBOX_SUPABASE_URL=https://destinyab.go.ro:8444"
            echo "CINEBOX_SUPABASE_ANON_KEY=${key}"
            echo "CINEBOX_SUPABASE_FALLBACK_URL="
            echo "CINEBOX_DISCORD_CLIENT_ID=1565830214301253632"
          } > local.properties

      # Every build gets an increasing, zero-padded version (0.1.33-alpha.0030) so the in-app updater
      # and GitHub's release ordering both agree on which one is the newest.
      - name: Compute app version
        run: echo "APP_VERSION=0.1.33-alpha.$(printf '%04d' "${GITHUB_RUN_NUMBER}")" >> "$GITHUB_ENV"

      - name: Build unsigned DMG
        env:
          MACOS_ARCH: ${{ inputs.arch }}
        run: |
          ./gradlew :composeApp:packageReleaseDmg \
            "-Pcinebox.macos.arch=${MACOS_ARCH}" \
            "-Pcinebox.desktop.versionName=${APP_VERSION}" \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache --no-daemon --stacktrace

      - name: Publish DMG to a private release
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_ARCH: ${{ inputs.arch }}
        run: |
          dmg="$(find composeApp/build -name "Cinebox-macOS-${MACOS_ARCH}-*.dmg" | head -n 1)"
          test -f "$dmg"
          ls -lh "$dmg"
          tag="v${APP_VERSION}"
          gh release create "$tag" "$dmg" --title "Build ${GITHUB_RUN_NUMBER} (${MACOS_ARCH})" --notes "" --prerelease
