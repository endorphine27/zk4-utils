name: Compile check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: touch local.properties
      - name: Compile desktop Kotlin
        run: ./gradlew :composeApp:compileKotlinDesktop -Pcompose.desktop.packaging.checkJdkVendor=false --no-configuration-cache --no-daemon --stacktrace
